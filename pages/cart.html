<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ตะกร้าสินค้าและการสั่งซื้อ | ALL MALL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/public/style.css" />
    <link rel="stylesheet" href="/public/css/customer.css" />
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="brand-logo">
                <span class="brand-mark">AM</span>
                <span>ALL <span class="brand-accent">MALL</span></span>
            </a>

            <nav class="nav-links">
                <a href="/" class="nav-btn">หน้าแรก</a>
                <a href="/pages/cart.html" class="nav-btn">
                    <span>ตะกร้าสินค้า</span>
                    <span id="nav-cart-badge" class="cart-badge">0</span>
                </a>
                <div id="nav-auth-area" style="display:inline-flex; gap:0.6rem; align-items:center;"></div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="cart-layout">
            <!-- Left: Cart Items & Order History -->
            <div>
                <div class="cart-panel" style="margin-bottom:1.5rem;">
                    <h2 class="section-heading">รายการสินค้าในตะกร้า</h2>
                    <div id="cart-items-list"></div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.25rem; padding-top:1rem; border-top:1px solid #e4e4e7;">
                        <span style="font-size:1rem; font-weight:600; color:#27272a;">ยอดรวมสินค้า</span>
                        <span id="cart-total-price" style="font-size:1.5rem; font-weight:700; color:#f97316;">฿0</span>
                    </div>
                </div>

                <div class="cart-panel">
                    <h3 class="section-heading">ประวัติคำสั่งซื้อและสถานะการจัดส่ง</h3>
                    <div id="order-history-list"></div>
                </div>
            </div>

            <!-- Right: Shipping Information Form -->
            <div class="checkout-panel">
                <h2 class="section-heading">ข้อมูลที่อยู่สำหรับจัดส่งสินค้า</h2>

                <form id="checkout-form">
                    <div class="form-group">
                        <label for="cust-name">ชื่อ-นามสกุลผู้รับ</label>
                        <input type="text" id="cust-name" class="form-control" placeholder="ระบุชื่อ-นามสกุลผู้รับสินค้า" required />
                    </div>

                    <div class="form-group">
                        <label for="cust-phone">หมายเลขโทรศัพท์ติดต่อ</label>
                        <input type="text" id="cust-phone" class="form-control" placeholder="เช่น 081-234-5678" required />
                    </div>

                    <div class="form-group">
                        <label for="cust-address">ที่อยู่สำหรับจัดส่งสินค้า</label>
                        <textarea id="cust-address" class="form-control" rows="3" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="cust-payment">ช่องทางการชำระเงินเริ่มต้น</label>
                        <select id="cust-payment" class="form-control">
                            <option value="QR PromptPay">สแกนชำระผ่าน QR PromptPay</option>
                            <option value="บัตรเครดิต / เดบิต">บัตรเครดิต / บัตรเดบิต</option>
                            <option value="โมบายแบงก์กิ้ง (Mobile Banking)">โมบายแบงก์กิ้ง (Mobile Banking)</option>
                            <option value="ชำระเงินปลายทาง (COD)">ชำระเงินปลายทาง (Cash on Delivery)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cust-note">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
                        <input type="text" id="cust-note" class="form-control" placeholder="ระบุข้อความถึงพนักงานจัดส่ง" />
                    </div>

                    <button type="submit" class="btn btn-orange" style="width:100%; padding:0.85rem; font-size:0.95rem; margin-top:0.35rem;">
                        ดำเนินการต่อเพื่อชำระเงิน →
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div><strong>ALL MALL CORPORATION</strong> — แพลตฟอร์มจัดจำหน่ายสินค้าออนไลน์ครบวงจร</div>
            <div>© 2026 ALL MALL Official Store. All rights reserved.</div>
        </div>
    </footer>

    <script type="module" src="/public/js/pages/cart.js"></script>
</body>
</html>
